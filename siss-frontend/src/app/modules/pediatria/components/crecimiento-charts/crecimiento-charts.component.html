<div class="grid grid-cols-1 xl:grid-cols-2 gap-8">
  
  <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
    <div class="flex items-center justify-between mb-6">
      <h3 class="font-bold text-gray-800">Peso para la Edad</h3>
      <span class="text-xs font-bold text-blue-600 bg-blue-50 px-2 py-1 rounded">Estándar OMS</span>
    </div>
    <div class="h-[350px] relative">
      <canvas #pesoEdadChart></canvas>
    </div>
  </div>

  <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
    <div class="flex items-center justify-between mb-6">
      <h3 class="font-bold text-gray-800">Talla para la Edad</h3>
      <span class="text-xs font-bold text-green-600 bg-green-50 px-2 py-1 rounded">Estándar OMS</span>
    </div>
    <div class="h-[350px] relative">
      <canvas #tallaEdadChart></canvas>
    </div>
  </div>

  <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 xl:col-span-2">
    <div class="flex items-center justify-between mb-6">
      <h3 class="font-bold text-gray-800">Evolución del IMC</h3>
      <span class="text-xs font-bold text-purple-600 bg-purple-50 px-2 py-1 rounded">Seguimiento Longitudinal</span>
    </div>
    <div class="h-[350px] relative">
      <canvas #imcChart></canvas>
    </div>
  </div>

</div>
